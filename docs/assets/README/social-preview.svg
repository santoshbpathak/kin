  <path d="M17 82 L83 82" stroke="#F7F2EA" stroke-width="8" stroke-linecap="round"/>
</g>
  <text x="232" y="180" font-family="Manrope, Inter, system-ui, sans-serif" font-size="84" font-weight="700" fill="#F7F2EA" letter-spacing="-2.5">kin</text>
  <text x="232" y="222" font-family="Manrope, Inter, system-ui, sans-serif" font-size="20" font-weight="600" fill="#F7F2EA" fill-opacity="0.72" letter-spacing="2.8">FINANCIAL PROTECTION INTELLIGENCE PLATFORM</text>
  <text x="96" y="340" font-family="Manrope, Inter, system-ui, sans-serif" font-size="48" font-weight="700" fill="#F7F2EA" letter-spacing="-1.2">Know how protected</text>
  <text x="96" y="396" font-family="Manrope, Inter, system-ui, sans-serif" font-size="48" font-weight="700" fill="#F7F2EA" letter-spacing="-1.2">your family really is.</text>
  <text x="96" y="452" font-family="Manrope, Inter, system-ui, sans-serif" font-size="24" font-weight="500" fill="#F7F2EA" fill-opacity="0.72">A two-minute, anonymous protection check with every number explained.</text>
  <text x="96" y="560" font-family="Manrope, Inter, system-ui, sans-serif" font-size="20" font-weight="500" fill="#F7F2EA" fill-opacity="0.55">Open source · React PWA · NestJS API · PostgreSQL · built for India</text>
