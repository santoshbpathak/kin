<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="t d">
  <title id="t">KIN — open-source Financial Protection Intelligence Platform</title>
  <desc id="d">1280 by 640 social preview: official KIN Shelter mark and wordmark in sand on navy, the headline "Know how protected your family really is.", a one-line description, the stack line, and an illustrative Protection Score ring reading 82.</desc>
