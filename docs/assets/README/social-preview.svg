    <circle r="110" fill="none" stroke="url(#ring)" stroke-width="18" stroke-linecap="round" stroke-dasharray="408 691" transform="rotate(-90)"/>
    <text y="16" text-anchor="middle" font-family="Manrope, Inter, system-ui, sans-serif" font-size="72" font-weight="700" fill="#F7F2EA">59</text>
    <text y="52" text-anchor="middle" font-family="Manrope, Inter, system-ui, sans-serif" font-size="16" font-weight="600" fill="#5BD3C3" letter-spacing="2">PROTECTION SCORE</text>
