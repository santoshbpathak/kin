<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d">
  <title id="t">KIN — Financial Protection Intelligence Platform</title>
  <desc id="d">Banner with the KIN house-and-three-dots mark, the product name, and the line: know how protected your family really is.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102A43"/>
      <stop offset="1" stop-color="#0F3D52"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#18A999"/>
      <stop offset="1" stop-color="#5BD3C3"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <!-- subtle grid -->
  <g stroke="#FFFFFF" stroke-opacity="0.045">
    <path d="M0 75H1200M0 150H1200M0 225H1200"/>
    <path d="M300 0V300M600 0V300M900 0V300"/>
  </g>
  <!-- KIN mark: house + three dots -->
  <g transform="translate(96 78)">
    <path d="M72 6 6 60h18v78h96V60h18Z" fill="none" stroke="#F7F2EA" stroke-width="9" stroke-linejoin="round"/>
    <circle cx="48" cy="112" r="9" fill="#18A999"/>
    <circle cx="72" cy="112" r="9" fill="#F5A623"/>
    <circle cx="96" cy="112" r="9" fill="#E85D5A"/>
  </g>
  <!-- wordmark -->
  <text x="268" y="128" font-family="Manrope, Inter, 'Segoe UI', system-ui, sans-serif" font-size="88" font-weight="700" fill="#F7F2EA" letter-spacing="-2">kin</text>
  <text x="268" y="172" font-family="Manrope, Inter, 'Segoe UI', system-ui, sans-serif" font-size="26" font-weight="600" fill="#5BD3C3" letter-spacing="2">FINANCIAL PROTECTION INTELLIGENCE</text>
  <text x="268" y="222" font-family="Manrope, Inter, 'Segoe UI', system-ui, sans-serif" font-size="24" fill="#F7F2EA" fill-opacity="0.86">Know how protected your family really is — anonymous, explainable, open source.</text>
  <!-- score ring -->
  <g transform="translate(1020 150)">
    <circle r="78" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="14"/>
    <circle r="78" fill="none" stroke="url(#ring)" stroke-width="14" stroke-linecap="round" stroke-dasharray="289 490" transform="rotate(-90)"/>
    <text y="12" text-anchor="middle" font-family="Manrope, Inter, system-ui, sans-serif" font-size="54" font-weight="700" fill="#F7F2EA">59</text>
    <text y="40" text-anchor="middle" font-family="Manrope, Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#5BD3C3" letter-spacing="1.5">PROTECTION SCORE</text>
  </g>
</svg>
